<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src http: https: data:">
  <title>GamePort Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tabstrip">
    <div id="tabs" role="tablist"></div>
    <button id="newtab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
  </div>

  <div id="toolbar">
    <button id="back" title="Back (Alt+Left)" aria-label="Back">&#8249;</button>
    <button id="forward" title="Forward (Alt+Right)" aria-label="Forward">&#8250;</button>
    <button id="reload" title="Reload (F5)" aria-label="Reload">&#10227;</button>
    <button id="home" title="Home" aria-label="Home">&#8962;</button>
    <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address">
    <button id="media" title="Play or pause media in this tab" aria-label="Play or pause media">&#9199;</button>
    <button id="mute" title="Mute this tab" aria-label="Mute this tab">&#128266;</button>
    <button id="net" class="chip" title="Network route. Click to change."></button>
    <button id="gear" title="Settings (Ctrl+,)" aria-label="Settings">&#9881;</button>
  </div>

  <div id="settings" hidden>
    <form id="settings-form" autocomplete="off">
      <h2>Settings</h2>

      <fieldset>
        <legend>Network route</legend>
        <label>Route
          <select id="s-mode">
            <option value="builtin">Built-in proxy (this app runs it)</option>
            <option value="external">External proxy (already running)</option>
            <option value="direct">Direct (no proxy)</option>
          </select>
        </label>
        <div class="row">
          <label>Host <input id="s-host" type="text"></label>
          <label class="narrow">Port <input id="s-port" type="number" min="1" max="65535"></label>
        </div>
        <label class="check"><input id="s-up-en" type="checkbox"> Chain the built-in proxy to another proxy</label>
        <div class="row">
          <label>Upstream host <input id="s-up-host" type="text"></label>
          <label class="narrow">Port <input id="s-up-port" type="number" min="1" max="65535"></label>
        </div>
        <label>Bypass rules <input id="s-bypass" type="text"></label>
        <label>Blocked hosts (comma separated) <input id="s-blocked" type="text"></label>
        <label class="check"><input id="s-rtc" type="checkbox"> Keep WebRTC traffic inside the proxy (turns off WebRTC voice and peer-to-peer)</label>
        <p id="s-stats" class="note"></p>
      </fieldset>

      <fieldset>
        <legend>Browsing</legend>
        <label>Home page <input id="s-home" type="text"></label>
        <label>Search URL (use %s for the query) <input id="s-search" type="text"></label>
        <label class="check"><input id="s-media" type="checkbox"> Allow sites to ask for camera and microphone</label>
        <label>Put idle background tabs to sleep after (minutes, 0 = never)
          <input id="s-sleep" type="number" min="0" max="1440">
        </label>
      </fieldset>

      <p id="s-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" id="s-cancel">Cancel</button>
        <button type="submit" id="s-save" class="primary">Save and apply</button>
      </div>
    </form>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
